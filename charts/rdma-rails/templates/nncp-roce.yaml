{{- /*
RoCE mode: one NodeNetworkConfigurationPolicy per (node, NIC). Each node's rail NIC has a unique
host IP, so the policy is pinned to that node by hostname (a cluster-wide policy cannot carry a
different IP per node). Per NIC: static IPv4 + exactly one route per dst prefix via this rail's
gateway. One route per NIC keeps the host routing table unambiguous -> deterministic NIC selection,
so NCCL_CROSS_NIC=0 holds (the ECMP-avoidance rule, now enforced host-side instead of in NAD IPAM).
Schema: nmstate.io ethernet interface + top-level routes.config[]. See chart CLAUDE.md.
*/}}
{{- if eq .Values.mode "roce" }}
{{- range $node := .Values.roce.nodes }}
{{- range $nic := $node.nics }}
{{- $parts := splitList "/" $nic.ip }}
---
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: rdma-roce-{{ $node.name }}-{{ $nic.name }}
spec:
  nodeSelector:
    kubernetes.io/hostname: {{ $node.name }}
  desiredState:
    interfaces:
      - name: {{ $nic.name }}
        type: ethernet
        state: up
        mtu: {{ $.Values.roce.mtu }}
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: {{ index $parts 0 }}
              prefix-length: {{ index $parts 1 }}
    routes:
      config:
        {{- range $dst := $nic.routes }}
        - destination: {{ $dst }}
          next-hop-address: {{ $nic.gateway }}
          next-hop-interface: {{ $nic.name }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
